<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRL Studio – OBS Solo</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0A0A0A; overflow: hidden; font-family: system-ui, sans-serif; }
    #stage { position: absolute; inset: 0; display: grid; gap: 8px; padding: 8px; }
    #stage.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #stage.count-2 { grid-template-columns: 1fr 1fr; }
    #stage.count-3, #stage.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .tile { position: relative; min-height: 0; background: #111; border: 3px solid #FF1744; border-radius: 16px; overflow: hidden; }
    .tile video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .tile .label { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.75); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; }
    .tile .dbg { position: absolute; right: 8px; top: 8px; background: rgba(0,0,0,.65); color: #0f0; font-size: 10px; font-family: monospace; padding: 2px 6px; border-radius: 4px; }
    #badge { position: fixed; top: 12px; left: 12px; z-index: 10; background: #FF1744; color: #fff; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 8px; }
    #status { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #ccc; padding: 6px 16px; border-radius: 20px; font-size: 13px; z-index: 10; max-width: 90%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #help { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #0A0A0A; color: #aaa; z-index: 50; padding: 24px; text-align: center; }
    #help h1 { color: #fff; font-size: 22px; }
    #help code { background: #1A1A1A; color: #4FC3F7; padding: 10px 16px; border-radius: 10px; font-size: 13px; word-break: break-all; }
    #unmute { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; padding: 12px 22px; background: #FF1744; color: #fff; border: 0; border-radius: 24px; font-weight: 700; display: none; cursor: pointer; }
    #pix { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; pointer-events: none; z-index: 20; }
    #pix.visible { display: block; }
  </style>
</head>
<body>
  <div id="badge">SOLO</div>
  <div id="stage" class="count-1"></div>
  <iframe id="pix" allow="autoplay"></iframe>
  <div id="status">Iniciando…</div>
  <div id="help">
    <h1>IRL Studio – OBS Solo</h1>
    <p>URL no OBS Browser Source:</p>
    <code>https://cleberson89.github.io/Soloirl/?room=SEU_CODIGO</code>
    <p>App: mesmo código → <strong>AO VIVO</strong></p>
  </div>
  <button id="unmute" type="button">Clique para liberar áudio</button>
  <script>
    const params = new URLSearchParams(location.search);
    const room = (params.get('room') || '').trim().toUpperCase();
    const pixUrl = params.get('pix') || '';
    if (!room || room.length < 4) {
      document.getElementById('help').style.display = 'flex';
      document.getElementById('status').style.display = 'none';
      document.getElementById('badge').style.display = 'none';
      throw new Error('room');
    }
    const OBS_ID = room + '_obs';
    const stage = document.getElementById('stage');
    const statusEl = document.getElementById('status');
    const tiles = {};
    const activeCalls = {};
    let peer = null, starting = false, idRetry = 0, restartTimer = null;

    const ICE = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        {
          urls: [
            'turn:openrelay.metered.ca:80',
            'turn:openrelay.metered.ca:443',
            'turn:openrelay.metered.ca:443?transport=tcp',
            'turns:openrelay.metered.ca:443'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    function setStatus(t, ms) {
      statusEl.textContent = t;
      statusEl.style.opacity = '1';
      if (ms) setTimeout(() => { statusEl.style.opacity = '0.45'; }, ms);
    }
    function setCount(n) { stage.className = 'count-' + Math.min(Math.max(n || 1, 1), 4); }
    function hostKey(peerId) {
      const p = String(peerId || '').split('_');
      return p.length >= 3 ? p.slice(0, -1).join('_') : peerId;
    }
    function displayNameFrom(id, metadata) {
      if (metadata && metadata.name) {
        const parts = String(metadata.name).split('_');
        return parts.length >= 2 ? parts[1] : metadata.name;
      }
      const parts = String(id || '').split('_');
      return parts.length >= 2 ? parts[1] : (id || 'Host');
    }
    function trackSummary(stream) {
      if (!stream) return 'sem stream';
      const ts = stream.getTracks();
      if (!ts.length) return '0 tracks';
      return ts.map(t => t.kind[0] + ':' + t.readyState + (t.muted ? ':mut' : '') + (t.enabled ? '' : ':off')).join(' ');
    }
    function removeTileByKey(key) {
      const t = tiles[key];
      if (!t) return;
      try { if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el); } catch (e) {}
      delete tiles[key];
      setCount(Object.keys(tiles).length);
      if (!Object.keys(tiles).length) setStatus('SOLO pronto • ' + room, 4000);
      broadcastRoster();
    }
    function removeTile(id) {
      removeTileByKey(hostKey(id));
      if (tiles[id]) removeTileByKey(id);
    }
    function addTile(id, name, stream) {
      const key = hostKey(id);
      if (!stream || !stream.getTracks || !stream.getTracks().length) {
        console.warn('[SOLO] stream vazio', id);
        return;
      }
      console.log('[SOLO] addTile', id, trackSummary(stream));
      if (tiles[key]) {
        const t = tiles[key];
        t.video.srcObject = stream;
        t.video.muted = true;
        t.video.play().catch(() => {});
        if (t.audio) { t.audio.srcObject = stream; t.audio.play().catch(() => {}); }
        t.label.textContent = name;
        if (t.dbg) t.dbg.textContent = trackSummary(stream);
        return;
      }
      const el = document.createElement('div');
      el.className = 'tile';
      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('autoplay', '');
      video.srcObject = stream;
      video.play().catch(e => console.warn('play', e));
      el.appendChild(video);
      const audio = document.createElement('audio');
      audio.autoplay = true;
      audio.srcObject = stream;
      audio.play().catch(() => {});
      el.appendChild(audio);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = name;
      el.appendChild(label);
      const dbg = document.createElement('div');
      dbg.className = 'dbg';
      dbg.textContent = trackSummary(stream);
      el.appendChild(dbg);
      stage.appendChild(el);
      tiles[key] = { el, video, audio, label, dbg, peerId: id, lastTime: 0, frozenSince: 0 };
      setCount(Object.keys(tiles).length);
      setStatus('Ao vivo • ' + room + ' (' + Object.keys(tiles).length + ') ' + trackSummary(stream), 4000);
      document.getElementById('unmute').style.display = 'block';
      broadcastRoster();
    }

    function broadcastRoster() {}

    /** Coleta tracks do PC e monta MediaStream (corrige race PeerJS) */
    function collectStream(pc) {
      if (!pc) return null;
      const ms = new MediaStream();
      try {
        (pc.getReceivers ? pc.getReceivers() : []).forEach(r => {
          if (r.track && r.track.readyState !== 'ended') ms.addTrack(r.track);
        });
      } catch (e) {}
      try {
        const rs = pc.getRemoteStreams ? pc.getRemoteStreams() : [];
        rs.forEach(s => s.getTracks().forEach(t => {
          if (t.readyState !== 'ended' && !ms.getTracks().find(x => x.id === t.id)) ms.addTrack(t);
        }));
      } catch (e) {}
      return ms.getTracks().length ? ms : null;
    }

    function bindCallMedia(call, key, name) {
      const pc = call.peerConnection;
      const tryApply = (reason) => {
        // PeerJS pode expor remoteStream
        let stream = null;
        try { stream = call.remoteStream || null; } catch (e) {}
        if (!stream || !stream.getTracks().length) stream = collectStream(pc);
        if (stream && stream.getTracks().length) {
          console.log('[SOLO] media via', reason, trackSummary(stream));
          addTile(call.peer, name, stream);
          return true;
        }
        return false;
      };

      // ANTES de qualquer coisa — listeners
      call.on('stream', (stream) => {
        console.log('[SOLO] event stream', trackSummary(stream));
        if (stream) addTile(call.peer, name, stream);
      });

      if (pc) {
        pc.addEventListener('track', (ev) => {
          console.log('[SOLO] ontrack', ev.track && ev.track.kind, ev.track && ev.track.readyState);
          if (ev.streams && ev.streams[0]) {
            addTile(call.peer, name, ev.streams[0]);
          } else if (ev.track) {
            const ms = collectStream(pc) || new MediaStream([ev.track]);
            addTile(call.peer, name, ms);
          }
        });
        pc.addEventListener('iceconnectionstatechange', () => {
          const s = pc.iceConnectionState;
          console.log('[SOLO] ice', s);
          if (s === 'connected' || s === 'completed') {
            setStatus('ICE ' + s + ' • buscando mídia…');
            tryApply('ice-' + s);
          }
          if (s === 'failed' || s === 'closed') {
            setTimeout(() => {
              if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'closed') {
                if (activeCalls[key] === call) delete activeCalls[key];
                removeTileByKey(key);
              }
            }, 2000);
          }
        });
        pc.addEventListener('connectionstatechange', () => {
          console.log('[SOLO] conn', pc.connectionState);
          if (pc.connectionState === 'connected') tryApply('pc-connected');
        });
      }

      // Se stream já existir (race)
      tryApply('immediate');

      // Poll agressivo por ~15s
      let n = 0;
      const iv = setInterval(() => {
        n++;
        if (tryApply('poll-' + n) || n >= 30) clearInterval(iv);
      }, 500);
    }

    function destroyPeer() {
      Object.keys(activeCalls).forEach(k => { try { activeCalls[k].close(); } catch (e) {} delete activeCalls[k]; });
      Object.keys(tiles).forEach(k => removeTileByKey(k));
      try { if (peer && !peer.destroyed) peer.destroy(); } catch (e) {}
      peer = null;
    }
    function scheduleRestart(ms) {
      if (restartTimer) clearTimeout(restartTimer);
      starting = false;
      restartTimer = setTimeout(() => { restartTimer = null; start(); }, ms);
    }
    function bindHandlers() {
      peer.on('open', () => {
        idRetry = 0; starting = false;
        if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
        setStatus('SOLO pronto • ' + room, 4000);
        console.log('[SOLO] open', OBS_ID);
      });
      peer.on('call', (call) => {
        const key = hostKey(call.peer);
        const name = displayNameFrom(call.peer, call.metadata);
        console.log('[SOLO] CALL de', call.peer, name);
        if (activeCalls[key] && activeCalls[key] !== call) {
          try { activeCalls[key].close(); } catch (e) {}
          removeTileByKey(key);
        }
        activeCalls[key] = call;
        setStatus('Recebendo: ' + name + '…');

        // 1) Bind media FIRST (evita perder stream)
        bindCallMedia(call, key, name);

        // 2) Answer sem stream local (só recebe do app)
        try { call.answer(); } catch (e) { console.warn('answer', e); }

        call.on('close', () => { if (activeCalls[key] === call) delete activeCalls[key]; removeTileByKey(key); });
        call.on('error', (e) => { console.warn('call err', e); if (activeCalls[key] === call) delete activeCalls[key]; removeTileByKey(key); });
      });

      peer.on('connection', (conn) => { try { conn.close(); } catch (e) {} });

      peer.on('disconnected', () => {
        setStatus('SOLO — reconectando…');
        setTimeout(() => {
          try {
            if (!peer || peer.destroyed) { scheduleRestart(2000); return; }
            if (!peer.disconnected) { setStatus('SOLO pronto • ' + room, 3000); return; }
            peer.reconnect();
          } catch (e) { scheduleRestart(3000); }
        }, 1500);
      });
      peer.on('close', () => { if (!starting) { setStatus('SOLO — reabrindo…'); scheduleRestart(2500); } });
      peer.on('error', (err) => {
        console.warn('[SOLO] err', err && err.type, err);
        if (err.type === 'unavailable-id') {
          idRetry++; setStatus('ID ocupado (' + idRetry + ')…'); destroyPeer();
          scheduleRestart(Math.min(3000 + idRetry * 2000, 15000));
        } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'websocket-error') {
          destroyPeer(); scheduleRestart(4000);
        } else if (err.type !== 'peer-unavailable') setStatus('Erro: ' + err.type);
      });
    }
    function start() {
      if (starting) return;
      starting = true;
      setStatus('SOLO • ' + room + '…');
      if (pixUrl) {
        const pix = document.getElementById('pix');
        pix.src = pixUrl; pix.classList.add('visible');
      }
      destroyPeer();
      setTimeout(() => {
        try {
          peer = new Peer(OBS_ID, {
            host: '0.peerjs.com', port: 443, path: '/', secure: true,
            debug: 2, pingInterval: 3000, config: ICE
          });
          bindHandlers();
        } catch (e) { starting = false; setStatus('Falha peer'); scheduleRestart(5000); }
      }, 800);
    }
    setInterval(() => {
      Object.keys(tiles).forEach(key => {
        const tile = tiles[key];
        if (!tile || !tile.video) return;
        const stream = tile.video.srcObject;
        if (tile.dbg) tile.dbg.textContent = trackSummary(stream);
        const tracks = stream ? stream.getTracks() : [];
        if (!stream || !tracks.length || tracks.every(t => t.readyState === 'ended')) {
          removeTileByKey(key); return;
        }
        try {
          const ct = tile.video.currentTime;
          if (Math.abs(ct - (tile.lastTime || 0)) < 0.01) tile.frozenSince = (tile.frozenSince || 0) + 1;
          else tile.frozenSince = 0;
          tile.lastTime = ct;
          if (tile.frozenSince >= 10) tile.video.play().catch(() => {});
          if (tile.frozenSince >= 25) removeTileByKey(key);
        } catch (e) {}
      });
    }, 1000);
    document.getElementById('unmute').onclick = function () {
      Object.values(tiles).forEach(t => {
        if (t.audio) t.audio.play().catch(() => {});
        if (t.video) { t.video.muted = true; t.video.play().catch(() => {}); }
      });
      this.style.display = 'none';
    };
    window.addEventListener('beforeunload', () => destroyPeer());
    start();
  </script>
</body>
</html>
