<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRL Studio – OBS Solo</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0A0A0A;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: absolute; inset: 0;
      display: grid; gap: 8px; padding: 8px;
    }
    #stage.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #stage.count-2 { grid-template-columns: 1fr 1fr; }
    #stage.count-3, #stage.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .tile {
      position: relative; min-height: 0;
      background: #111;
      border: 3px solid #FF1744;
      border-radius: 16px;
      overflow: hidden;
    }
    .tile video {
      width: 100%; height: 100%;
      object-fit: cover;
      background: #000;
    }
    .tile .label {
      position: absolute; left: 8px; bottom: 8px;
      background: rgba(0,0,0,.75);
      color: #fff;
      font-size: 12px; font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
    }
    #badge {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: #FF1744; color: #fff;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border-radius: 8px;
    }
    #status {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.8);
      color: #ccc;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 10;
      transition: opacity .3s;
      max-width: 80%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #help {
      position: fixed; inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #0A0A0A;
      color: #aaa;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }
    #help h1 { color: #fff; font-size: 22px; }
    #help code {
      background: #1A1A1A;
      color: #4FC3F7;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      word-break: break-all;
    }
    #help .hint { font-size: 13px; color: #666; max-width: 420px; line-height: 1.5; }
    #unmute {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 100;
      padding: 12px 22px;
      background: #FF1744;
      color: #fff;
      border: 0;
      border-radius: 24px;
      font-weight: 700;
      font-size: 14px;
      display: none;
      cursor: pointer;
    }
    #pix {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
      display: none;
      pointer-events: none;
      z-index: 20;
    }
    #pix.visible { display: block; }
  </style>
</head>
<body>
  <div id="badge">SOLO</div>
  <div id="stage" class="count-1"></div>
  <iframe id="pix" allow="autoplay"></iframe>
  <div id="status">Iniciando…</div>
  <div id="help">
    <h1>IRL Studio — OBS Solo</h1>
    <p class="hint">Abra no Browser Source do OBS com o código da sala:</p>
    <code>https://cleberson89.github.io/Soloirl/?room=SEU_CODIGO</code>
    <p class="hint">Depois entre no app com o mesmo código e toque em <strong>AO VIVO</strong>.</p>
  </div>
  <button id="unmute" type="button">Clique para liberar áudio</button>

  <script>
    const params = new URLSearchParams(location.search);
    const room = (params.get('room') || '').trim().toUpperCase();
    const pixUrl = params.get('pix') || '';

    if (!room || room.length < 4) {
      document.getElementById('help').style.display = 'flex';
      document.getElementById('status').style.display = 'none';
      document.getElementById('badge').style.display = 'none';
      throw new Error('room required');
    }

    // Mesmo padrão do app nativo: room_obs
    const OBS_ID = room + '_obs';
    const stage = document.getElementById('stage');
    const statusEl = document.getElementById('status');
    const pixFrame = document.getElementById('pix');
    const tiles = {};
    const activeCalls = {};
    let peer = null;
    let starting = false;
    let idRetry = 0;
    let restartTimer = null;

    // ICE alinhado com WebRtcClient do app (STUN Google + TURN openrelay)
    const ICE = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        {
          urls: [
            'turn:openrelay.metered.ca:80',
            'turn:openrelay.metered.ca:443',
            'turn:openrelay.metered.ca:443?transport=tcp',
            'turns:openrelay.metered.ca:443'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ],
      iceTransportPolicy: 'all'
    };

    function setStatus(t, ms) {
      statusEl.textContent = t;
      statusEl.style.opacity = '1';
      if (ms) setTimeout(() => { statusEl.style.opacity = '0.4'; }, ms);
    }

    function setCount(n) {
      stage.className = 'count-' + Math.min(Math.max(n || 1, 1), 4);
    }

    // App peer id: ROOM_Name_xxxx → chave estável por host
    function hostKey(peerId) {
      const p = String(peerId || '').split('_');
      return p.length >= 3 ? p.slice(0, -1).join('_') : peerId;
    }

    function stopStream(stream) {
      if (!stream) return;
      try { stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); } catch (e) {}
    }

    function removeTileByKey(key) {
      const t = tiles[key];
      if (!t) return;
      stopStream(t.video && t.video.srcObject);
      try { if (t.audio) t.audio.pause(); } catch (e) {}
      try { if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el); } catch (e) {}
      delete tiles[key];
      setCount(Object.keys(tiles).length);
      if (Object.keys(tiles).length === 0) setStatus('SOLO pronto • ' + room, 4000);
    }

    function removeTile(id) {
      removeTileByKey(hostKey(id));
      if (tiles[id]) removeTileByKey(id);
    }

    function addTile(id, name, stream) {
      const key = hostKey(id);
      if (tiles[key]) {
        const t = tiles[key];
        stopStream(t.video.srcObject);
        t.video.muted = true;
        t.video.srcObject = stream;
        t.video.play().catch(() => {});
        if (t.audio) {
          try { t.audio.pause(); } catch (e) {}
          t.audio.srcObject = stream;
          t.audio.play().catch(() => {});
        }
        t.label.textContent = name;
        t.peerId = id;
        return;
      }

      const el = document.createElement('div');
      el.className = 'tile';

      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true; // autoplay no Browser Source; áudio no <audio>
      video.srcObject = stream;
      video.play().catch(() => {});
      el.appendChild(video);

      const audio = document.createElement('audio');
      audio.autoplay = true;
      audio.srcObject = stream;
      audio.play().catch(() => {});
      el.appendChild(audio);

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = name;
      el.appendChild(label);

      stage.appendChild(el);
      tiles[key] = { el, video, audio, label, peerId: id, lastTime: 0, frozenSince: 0 };
      setCount(Object.keys(tiles).length);
    }

    function watchCall(call, key) {
      const pc = call.peerConnection;
      if (!pc) return;
      const onState = () => {
        const ice = pc.iceConnectionState;
        const conn = pc.connectionState;
        if (ice === 'failed' || ice === 'closed' || conn === 'failed' || conn === 'closed') {
          setTimeout(() => {
            const i2 = pc.iceConnectionState, c2 = pc.connectionState;
            if (i2 === 'failed' || i2 === 'closed' || c2 === 'failed' || c2 === 'closed') {
              if (activeCalls[key] === call) delete activeCalls[key];
              removeTileByKey(key);
            }
          }, 2500);
        }
      };
      pc.addEventListener('iceconnectionstatechange', onState);
      pc.addEventListener('connectionstatechange', onState);
    }

    function destroyPeer() {
      Object.keys(activeCalls).forEach(k => {
        try { activeCalls[k].close(); } catch (e) {}
        delete activeCalls[k];
      });
      Object.keys(tiles).forEach(k => removeTileByKey(k));
      try { if (peer && !peer.destroyed) peer.destroy(); } catch (e) {}
      peer = null;
    }

    function scheduleRestart(ms) {
      if (restartTimer) clearTimeout(restartTimer);
      starting = false;
      restartTimer = setTimeout(() => {
        restartTimer = null;
        start();
      }, ms);
    }

    function bindHandlers() {
      peer.on('open', () => {
        idRetry = 0;
        starting = false;
        if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
        setStatus('SOLO pronto • ' + room, 4000);
        console.log('[SOLO] peer open', OBS_ID);
      });

      // App nativo envia media offer → PeerJS JS recebe como call
      peer.on('call', (call) => {
        const key = hostKey(call.peer);
        if (activeCalls[key] && activeCalls[key] !== call) {
          try { activeCalls[key].close(); } catch (e) {}
          removeTileByKey(key);
        }
        activeCalls[key] = call;

        // metadata.name = peerId do app (ROOM_Name_xxxx) ou só o nome
        let name = 'Host';
        if (call.metadata && call.metadata.name) {
          const parts = String(call.metadata.name).split('_');
          name = parts.length >= 2 ? parts[1] : call.metadata.name;
        } else {
          const parts = String(call.peer).split('_');
          name = parts.length >= 2 ? parts[1] : call.peer;
        }

        setStatus('Recebendo: ' + name);
        try { call.answer(); } catch (e) { console.warn('[SOLO] answer fail', e); }
        watchCall(call, key);

        call.on('stream', (stream) => {
          console.log('[SOLO] stream', stream.getTracks().map(t => t.kind + ':' + t.readyState));
          addTile(call.peer, name, stream);
          setStatus('Ao vivo • ' + room, 3000);
          try {
            const pc = call.peerConnection;
            if (pc && pc.getReceivers) {
              pc.getReceivers().forEach(r => {
                if (r.playoutDelayHint !== undefined) r.playoutDelayHint = 2.0;
              });
            }
          } catch (e) {}
          setTimeout(() => {
            if (Object.keys(tiles).length) document.getElementById('unmute').style.display = 'block';
          }, 800);
        });

        call.on('close', () => {
          if (activeCalls[key] === call) delete activeCalls[key];
          removeTileByKey(key);
        });
        call.on('error', () => {
          if (activeCalls[key] === call) delete activeCalls[key];
          removeTileByKey(key);
        });
      });

      // Solo: ignora data connections (sem roster) — alinhado ao app multiMode=false
      peer.on('connection', (conn) => {
        try { conn.close(); } catch (e) {}
      });

      peer.on('disconnected', () => {
        setStatus('SOLO — reconectando…');
        setTimeout(() => {
          try {
            if (!peer || peer.destroyed) {
              scheduleRestart(2000);
              return;
            }
            if (!peer.disconnected) {
              setStatus('SOLO pronto • ' + room, 3000);
              return;
            }
            peer.reconnect();
          } catch (e) {
            scheduleRestart(3000);
          }
        }, 1500);
      });

      peer.on('close', () => {
        if (!starting) {
          setStatus('SOLO — reabrindo peer…');
          scheduleRestart(2500);
        }
      });

      peer.on('error', (err) => {
        console.warn('[SOLO] peer error', err && err.type, err);
        if (err.type === 'unavailable-id') {
          idRetry++;
          setStatus('ID ocupado — liberando (' + idRetry + ')…');
          destroyPeer();
          scheduleRestart(Math.min(3000 + idRetry * 2000, 15000));
        } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'websocket-error') {
          destroyPeer();
          scheduleRestart(4000);
        } else if (err.type !== 'peer-unavailable') {
          setStatus('Erro: ' + err.type);
        }
      });
    }

    function start() {
      if (starting) return;
      starting = true;
      setStatus('SOLO • ' + room + '…');
      if (pixUrl) {
        pixFrame.src = pixUrl;
        pixFrame.classList.add('visible');
      }
      destroyPeer();
      setTimeout(() => {
        try {
          peer = new Peer(OBS_ID, {
            host: '0.peerjs.com',
            port: 443,
            path: '/',
            secure: true,
            debug: 0,
            pingInterval: 3000,
            config: ICE
          });
          bindHandlers();
        } catch (e) {
          starting = false;
          setStatus('Falha peer');
          scheduleRestart(5000);
        }
      }, 1000);
    }

    // Health check: remove tiles congelados / tracks ended
    setInterval(() => {
      Object.keys(tiles).forEach(key => {
        const tile = tiles[key];
        if (!tile || !tile.video) return;
        const stream = tile.video.srcObject;
        const tracks = stream ? stream.getTracks() : [];
        if (!stream || tracks.length === 0 || tracks.every(t => t.readyState === 'ended')) {
          removeTileByKey(key);
          return;
        }
        const call = activeCalls[key];
        if (call && call.peerConnection) {
          const ice = call.peerConnection.iceConnectionState;
          const conn = call.peerConnection.connectionState;
          if (ice === 'failed' || ice === 'closed' || conn === 'failed' || conn === 'closed') {
            removeTileByKey(key);
            return;
          }
        }
        try {
          const ct = tile.video.currentTime;
          if (Math.abs(ct - (tile.lastTime || 0)) < 0.01) tile.frozenSince = (tile.frozenSince || 0) + 1;
          else tile.frozenSince = 0;
          tile.lastTime = ct;
          if (tile.frozenSince >= 8) removeTileByKey(key);
        } catch (e) {}
      });
    }, 1000);

    document.getElementById('unmute').onclick = function () {
      Object.values(tiles).forEach(t => {
        if (t.audio) t.audio.play().catch(() => {});
        if (t.video) t.video.play().catch(() => {});
      });
      this.style.display = 'none';
    };

    window.addEventListener('beforeunload', () => destroyPeer());
    start();
  </script>
</body>
</html>
